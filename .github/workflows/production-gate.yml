name: Production Gate

on:
  push:
    branches:
      - main
  pull_request:
  # Manual trigger for fallback when push event is not processed by Actions.
  # workflow_dispatch carries no push/PR event refs, so base_sha is required.
  # The dispatch REF selects the revision GitHub runs; the AI Gate head is
  # always that same revision (GITHUB_SHA).  There is NO user-supplied head.
  workflow_dispatch:
    inputs:
      base_sha:
        description: >-
          Full 40-hex base commit SHA for the incremental diff (required).
          Must resolve to a commit in the repository, must not equal the
          dispatched commit, and must be an ancestor of it.
        required: true
        type: string

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: production-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEV_CONTAINER_CPU_LIMIT: "2.0"
  DEV_CONTAINER_CPU_RESERVATION: "0.5"
  DEV_NODE_MODULES_MOUNT: "${{ github.workspace }}/.cache/node_modules:/app/node_modules"
  DEV_CACHE_MOUNT: "${{ github.workspace }}/.cache/dev_root_cache:/root/.cache"
  DEV_NPM_MOUNT: "${{ github.workspace }}/.cache/npm:/root/.npm"
  DEV_GITCONFIG_MOUNT: "${{ github.workspace }}/.cache/gitconfig:/root/.config/git"

jobs:
  production-gate:
    name: Environment / Proxy / Static / Unit Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare CI cache directories
        run: |
          mkdir -p \
            .cache/node_modules \
            .cache/npm \
            .cache/dev_root_cache/pip \
            .cache/gitconfig \
            .cache/buildx \
            .cache/buildx-new \
            data/browser_profile

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/node_modules
            .cache/npm
            .cache/dev_root_cache/pip
          key: production-gate-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            production-gate-deps-${{ runner.os }}-

      - name: Restore Docker layer cache
        uses: actions/cache@v4
        with:
          path: .cache/buildx
          key: production-gate-buildx-${{ runner.os }}-${{ hashFiles('.devcontainer/Dockerfile', 'requirements.txt', 'mcp_servers/requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            production-gate-buildx-${{ runner.os }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Warm dev image cache
        run: |
          docker buildx build \
            --load \
            --tag footballprediction:v175-stable \
            --file .devcontainer/Dockerfile \
            --build-arg APT_MIRROR_HOST=deb.debian.org \
            --build-arg NPM_REGISTRY=https://registry.npmjs.org \
            --build-arg PIP_INDEX_URL=https://pypi.org/simple \
            --build-arg PIP_TRUSTED_HOST=pypi.org \
            --cache-from type=local,src=.cache/buildx \
            --cache-to type=local,dest=.cache/buildx-new,mode=min \
            .

      - name: Rotate Docker layer cache
        if: always()
        run: |
          rm -rf .cache/buildx
          if [ -d .cache/buildx-new ]; then
            mv .cache/buildx-new .cache/buildx
          fi

      - name: Print resolved dev environment
        run: |
          docker compose -f docker-compose.dev.yml config > /tmp/production-gate.compose.yml
          echo "[Production Gate] Resolved dev container environment:"
          awk '
            /^  dev:$/ { in_dev=1 }
            in_dev { print }
            in_dev && /^    working_dir:/ { exit }
          ' /tmp/production-gate.compose.yml | \
            grep -E 'DB_HOST:|DB_PORT:|DB_NAME:|REDIS_HOST:|REDIS_PORT:|PROXY_HOST:|WSL2_PROXY_HOST:|cpus:'

      - name: CI Environment Diagnostics
        env:
          DEV_DB_HOST: db
          DEV_REDIS_HOST: redis
          DEV_PROXY_HOST: 127.0.0.1
        run: |
          docker compose -f docker-compose.dev.yml up -d dev db redis
          echo "[Production Gate] Working directory:"
          pwd
          echo "[Production Gate] Container status:"
          docker compose -f docker-compose.dev.yml ps
          echo "[Production Gate] DEV_* environment variables:"
          env | grep '^DEV_' || true
          echo "[Production Gate] Container network alias probe (dev -> db):"
          docker compose -f docker-compose.dev.yml exec -T dev bash -lc 'ping -c 2 db'

      - name: Install project dependencies
        run: |
          echo "[Production Gate] Installing Node.js dependencies..."
          docker compose -f docker-compose.dev.yml exec -T dev bash -lc 'npm ci'
          echo "[Production Gate] Verifying critical dependencies..."
          docker compose -f docker-compose.dev.yml exec -T dev bash -lc 'node -e "require(\"playwright\"); require(\"pg\"); require(\"nock\"); console.log(\"✓ All critical dependencies installed\")"'

      - name: Run Gatekeeper
        env:
          GATEKEEPER_BUILD: "0"
          GATEKEEPER_CI_MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'push' }}
          DEV_DB_HOST: db
          DEV_REDIS_HOST: redis
          DEV_PROXY_HOST: 127.0.0.1
          DB_BLUEPRINT_DEBUG: "1"
          DB_BLUEPRINT_CONNECT_TIMEOUT_MS: "5000"
          DB_BLUEPRINT_STATEMENT_TIMEOUT_MS: "30000"
        run: |
          set -u
          before="$(git status --porcelain=v1 -uall)"
          status=0
          validation_profile="pr"
          if [ "${GATEKEEPER_CI_MODE}" = "push" ]; then
            validation_profile="strict"
          fi
          if python3 scripts/devops/validation_profiles.py "${validation_profile}"; then
            :
          else
            status=$?
          fi
          after="$(git status --porcelain=v1 -uall)"
          if [ "$before" != "$after" ]; then
            echo "[Production Gate] 测试或门禁修改了 Git 工作树，拒绝放行。" >&2
            echo "[Production Gate] 测试前:" >&2
            printf '%s\n' "${before:-（clean）}" >&2
            echo "[Production Gate] 测试后:" >&2
            printf '%s\n' "${after:-（clean）}" >&2
            status=1
          fi
          exit "$status"

      - name: AI Workflow Gate (P0)
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_EVENT_NAME: ${{ github.event_name }}
          GATE_PR_NUMBER: ${{ github.event.pull_request.number }}
          GATE_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GATE_PUSH_BEFORE: ${{ github.event.before }}
          GATE_PUSH_AFTER: ${{ github.event.after }}
          GATE_DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
          GATE_GITHUB_SHA: ${{ github.sha }}
        run: |
          PR_BODY_FILE="$(mktemp -t pr-body.XXXXXX)"
          if [ "${GATE_EVENT_NAME}" = "pull_request" ]; then
            echo "[AI Workflow Gate] Fetching PR body via gh CLI for PR #${GATE_PR_NUMBER}"
            gh pr view "${GATE_PR_NUMBER}" --json body --jq '.body' > "${PR_BODY_FILE}"
            echo "[AI Workflow Gate] PR body fetched ($(wc -l < "${PR_BODY_FILE}") lines, $(wc -c < "${PR_BODY_FILE}") bytes)."
            # Pull-request events always require PR metadata.  An empty body
            # must fail inside ai_workflow_gate.py rather than downgrading the
            # event to diff-only validation.
            AI_GATE_REFS="$(python3 scripts/ops/helpers/ai_gate_event_refs.py \
              pull_request \
              "${GATE_PR_BASE_SHA}" \
              "${GATE_PR_HEAD_SHA}")" || exit $?
            read -r AI_GATE_BASE_REF AI_GATE_HEAD_REF <<< "${AI_GATE_REFS}"
            python3 scripts/ops/ai_workflow_gate.py \
              --pr-body-file "${PR_BODY_FILE}" \
              --base-ref "${AI_GATE_BASE_REF}" \
              --head-ref "${AI_GATE_HEAD_REF}" \
              --block-matrix
          elif [ "${GATE_EVENT_NAME}" = "workflow_dispatch" ]; then
            # Manual dispatch — explicit base_sha input is required and must
            # be a full 40-hex ancestor of the dispatched commit.  The head
            # is ALWAYS the dispatched revision (GATE_GITHUB_SHA), the exact
            # revision actions/checkout tested.  No PR body exists, so run
            # git-diff checks only (same semantics as the push path).
            echo "[AI Workflow Gate] Manual dispatch event. Resolving explicit base/head refs."
            touch "${PR_BODY_FILE}"
            AI_GATE_REFS="$(python3 scripts/ops/helpers/ai_gate_event_refs.py \
              workflow_dispatch \
              "${GATE_DISPATCH_BASE_SHA}" \
              "${GATE_GITHUB_SHA}")" || exit $?
            read -r AI_GATE_BASE_REF AI_GATE_HEAD_REF <<< "${AI_GATE_REFS}"
            python3 scripts/ops/ai_workflow_gate.py \
              --pr-body-file "${PR_BODY_FILE}" \
              --base-ref "${AI_GATE_BASE_REF}" \
              --head-ref "${AI_GATE_HEAD_REF}" \
              --skip-body-checks
          elif [ "${GATE_EVENT_NAME}" = "push" ]; then
            # Push event on main — run git-diff-based checks only
            echo "[AI Workflow Gate] Push event. Running git-diff checks only."
            touch "${PR_BODY_FILE}"
            AI_GATE_REFS="$(python3 scripts/ops/helpers/ai_gate_event_refs.py \
              push \
              "${GATE_PUSH_BEFORE}" \
              "${GATE_PUSH_AFTER}")" || exit $?
            read -r AI_GATE_BASE_REF AI_GATE_HEAD_REF <<< "${AI_GATE_REFS}"
            python3 scripts/ops/ai_workflow_gate.py \
              --pr-body-file "${PR_BODY_FILE}" \
              --base-ref "${AI_GATE_BASE_REF}" \
              --head-ref "${AI_GATE_HEAD_REF}" \
              --skip-body-checks
          else
            # Unknown event type — fail closed instead of guessing a baseline.
            echo "[AI Workflow Gate] Unsupported event '${GATE_EVENT_NAME}' — failing closed." >&2
            exit 1
          fi
          rm -f "${PR_BODY_FILE}"

      - name: Validate Python UTF-8 and AST parse
        run: python3 scripts/devops/check_python_ast_utf8.py

      - name: L3 warning-only changed-file classifier
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          set -u
          echo "TECHDEBT-L3G warning-only changed-file classifier"
          echo "This step is warning-only and does not block CI."

          git fetch --no-tags --prune --depth=200 origin "${{ github.base_ref }}" || true

          python3 scripts/ci/l3_changed_file_classifier.py \
            --repo-root . \
            --base-ref "origin/${{ github.base_ref }}" \
            --head-ref "HEAD"

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: production-gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        run: |
          docker buildx build \
            --file Dockerfile \
            --build-arg NPM_REGISTRY=https://registry.npmjs.org \
            --cache-from type=gha,scope=production-image-buildx \
            --cache-to type=gha,scope=production-image-buildx,mode=min \
            .
